<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .bg { fill: #05070A; stroke: #fffff0; stroke-width: 4; }
      .text-title { fill: #F8FAFC; font-family: "Inter", "Segoe UI", sans-serif; font-size: 36px; font-weight: 800; letter-spacing: 6px; text-anchor: middle; }
      .text-address { fill: #94A3B8; font-family: "Courier New", monospace; font-size: 16px; font-weight: 600; letter-spacing: 3px; text-anchor: middle; }
      .text-arbiter { fill: #fffff0; font-family: "Inter", sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-anchor: middle; }
      .tension-zone { fill: #1c1006; stroke: #d97736; stroke-width: 2; stroke-dasharray: 6 4; }
      .text-tension { fill: #e58249; font-family: "Inter", sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; letter-spacing: 2px; }
      .stack-zone { fill: none; stroke-width: 1.5; stroke-dasharray: 3 3; }
      .deployment-zone { fill: none; stroke-width: 1; stroke-dasharray: 2 2; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#020305" />
  <rect width="1600" height="1000" fill="url(#grid)" />

  <g>
    <path d="M 323.68602791855875 75.0 A 550 550 0 1 0 1276.3139720814413 75.0 Z" class="bg" filter="url(#glow)" />
    <path d="M 323.68602791855875 75.0 A 550 550 0 1 0 1276.3139720814413 75.0 Z" fill="url(#grid)" opacity="0.3" />

    <!-- ARBITER INFLUENCE -->
    <circle cx="800" cy="200" r="11" fill="#fffff0" filter="url(#glow)" />
    <text x="800" y="230" class="text-arbiter" filter="url(#glow)">ARBITER INFLUENCE</text>

    <!-- FLAT TITLE DEAD CENTER -->
    <text x="800" y="350" class="text-title" filter="url(#glow)">CHORUS NODE</text>

    <!-- FLAT METADATA BLOCKS -->
    <text x="800" y="410" class="text-address">Ring: Chorus Node</text>
    <text x="800" y="445" class="text-address">Address: 0.0</text>
    <text x="800" y="480" class="text-address">Generation: 0</text>

    <!-- TENSION ZONE (Moved Down) -->
    <g transform="rotate(0, 800, 350) translate(800, 560)">
      <polygon class="tension-zone" points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" filter="url(#glow)" />
      <text x="0" y="35" class="text-tension">TENSION</text>
    </g>

    <!-- Faction: GUILD -->
    <path d="M 549.0205629723569 608.0878187541739 L 430.50249548708086 729.9626220547559 A 530 530 0 0 0 489.9724322567758 779.8638240643431 L 589.4152370046024 641.9829748361576 A 360 360 0 0 1 549.0205629723569 608.0878187541739 Z" fill="#0a0c0f" stroke="#d4622a" stroke-width="2" />
    
    <!-- UI Layout (No Structure Placements) -->
    <g transform="rotate(40, 800, 350) translate(800, 710)">
      <circle class="stack-zone" cx="0" cy="40" r="11" stroke="#d4622a" />
      <polygon class="deployment-zone" points="-5,90 5,90 12,97 12,107 5,114 -5,114 -12,107 -12,97" stroke="#d4622a" />
      <polygon class="deployment-zone" points="-5,120 5,120 12,127 12,137 5,144 -5,144 -12,137 -12,127" stroke="#d4622a" />
    </g>

    <!-- Faction: GHOST -->
    <path d="M 652.4277078170338 678.3632418220183 L 582.7407920639664 833.4236615713046 A 530 530 0 0 0 655.6914690684956 859.9755365705212 L 701.9791110653932 696.3984776705427 A 360 360 0 0 1 652.4277078170338 678.3632418220183 Z" fill="#0a0c0f" stroke="#6a9978" stroke-width="2" />
    
    <!-- UI Layout (No Structure Placements) -->
    <g transform="rotate(20, 800, 350) translate(800, 710)">
      <circle class="stack-zone" cx="0" cy="40" r="11" stroke="#6a9978" />
      <polygon class="deployment-zone" points="-5,90 5,90 12,97 12,107 5,114 -5,114 -12,107 -12,97" stroke="#6a9978" />
      <polygon class="deployment-zone" points="-5,120 5,120 12,127 12,137 5,144 -5,144 -12,137 -12,127" stroke="#6a9978" />
    </g>

    <!-- Faction: DIRECTORATE -->
    <path d="M 773.6342490340526 709.0332118008049 L 761.1837555223552 878.5766729289628 A 530 530 0 0 0 838.8162444776449 878.5766729289628 L 826.3657509659474 709.0332118008049 A 360 360 0 0 1 773.6342490340526 709.0332118008049 Z" fill="#0a0c0f" stroke="#3a6ea8" stroke-width="2" />
    
    <!-- UI Layout (No Structure Placements) -->
    <g transform="rotate(0, 800, 350) translate(800, 710)">
      <circle class="stack-zone" cx="0" cy="40" r="11" stroke="#3a6ea8" />
      <polygon class="deployment-zone" points="-5,90 5,90 12,97 12,107 5,114 -5,114 -12,107 -12,97" stroke="#3a6ea8" />
      <polygon class="deployment-zone" points="-5,120 5,120 12,127 12,137 5,144 -5,144 -12,137 -12,127" stroke="#3a6ea8" />
    </g>

    <!-- Faction: NETWORK -->
    <path d="M 898.0208889346068 696.3984776705427 L 944.3085309315044 859.9755365705212 A 530 530 0 0 0 1017.2592079360336 833.4236615713047 L 947.5722921829662 678.3632418220184 A 360 360 0 0 1 898.0208889346068 696.3984776705427 Z" fill="#0a0c0f" stroke="#39d353" stroke-width="2" />
    
    <!-- UI Layout (No Structure Placements) -->
    <g transform="rotate(-20, 800, 350) translate(800, 710)">
      <circle class="stack-zone" cx="0" cy="40" r="11" stroke="#39d353" />
      <polygon class="deployment-zone" points="-5,90 5,90 12,97 12,107 5,114 -5,114 -12,107 -12,97" stroke="#39d353" />
      <polygon class="deployment-zone" points="-5,120 5,120 12,127 12,137 5,144 -5,144 -12,137 -12,127" stroke="#39d353" />
    </g>

    <!-- Faction: SYNDICATE -->
    <path d="M 1010.5847629953976 641.9829748361576 L 1110.0275677432242 779.8638240643431 A 530 530 0 0 0 1169.4975045129192 729.9626220547559 L 1050.9794370276431 608.0878187541738 A 360 360 0 0 1 1010.5847629953976 641.9829748361576 Z" fill="#0a0c0f" stroke="#c9a84c" stroke-width="2" />
    
    <!-- UI Layout (No Structure Placements) -->
    <g transform="rotate(-40, 800, 350) translate(800, 710)">
      <circle class="stack-zone" cx="0" cy="40" r="11" stroke="#c9a84c" />
      <polygon class="deployment-zone" points="-5,90 5,90 12,97 12,107 5,114 -5,114 -12,107 -12,97" stroke="#c9a84c" />
      <polygon class="deployment-zone" points="-5,120 5,120 12,127 12,137 5,144 -5,144 -12,137 -12,127" stroke="#c9a84c" />
    </g>
  </g>
</svg>