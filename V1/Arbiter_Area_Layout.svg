<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .area-boundary { fill: #111827; stroke: #4B5563; stroke-width: 4; rx: 16; ry: 16; }
      
      .arbiter-tableau { fill: #1F2937; stroke: #374151; stroke-width: 3; rx: 12; ry: 12; }
      .arbiter-public { fill: #1e253c; stroke: #374151; stroke-width: 3; rx: 12; ry: 12; }
      
      .subzone { fill: #080b13; stroke: #3B82F6; stroke-width: 2; stroke-dasharray: 4 4; rx: 8; ry: 8; }
      .hand-zone { fill: #172033; stroke: #60A5FA; stroke-width: 2; stroke-dasharray: 6 6; rx: 12; ry: 12; }
      .lane-zone { fill: #080b13; stroke: #93C5FD; stroke-width: 1; stroke-dasharray: 2 2; rx: 6; ry: 6; }
      .nested-zone { fill: #080b13; stroke: #93C5FD; stroke-width: 1; stroke-dasharray: 2 2; rx: 6; ry: 6; }
      
      .screen { fill: none; stroke: #F87171; stroke-width: 8; stroke-linecap: round; }
      
      .title { fill: #F3F4F6; font-family: "Inter", "Segoe UI", sans-serif; font-size: 28px; font-weight: 600; text-anchor: middle; }
      .mat-title { fill: #9CA3AF; font-family: "Inter", "Segoe UI", sans-serif; font-size: 22px; font-weight: 600; text-anchor: middle; letter-spacing: 2px; }
      .subzone-title { fill: #FFFFFF; font-family: "Inter", "Segoe UI", sans-serif; font-size: 18px; font-weight: 600; text-anchor: middle; }
      .lane-title { fill: #93C5FD; font-family: "Inter", "Segoe UI", sans-serif; font-size: 16px; font-weight: 500; text-anchor: middle; }
      .nested-title { fill: #E5E7EB; font-family: "Inter", "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .subtitle { fill: #9CA3AF; font-family: "Inter", "Segoe UI", sans-serif; font-size: 13px; text-anchor: middle; font-style: italic; }
      .screen-label { fill: #F87171; font-family: "Inter", "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; text-anchor: middle; letter-spacing: 4px; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1600" height="1600" />

  <!-- Main Arbiter Area Boundary (P6) -->
  <rect class="area-boundary" x="50" y="50" width="1500" height="1500" />
  <text x="800" y="100" class="title">ARBITER AREA (zone_p6_area)</text>

  <!-- ========================================== -->
  <!-- PUBLIC MAT (In Front of Screen - 25%)      -->
  <!-- ========================================== -->
  <rect class="arbiter-public" x="80" y="140" width="1440" height="220" />
  <text x="800" y="170" class="mat-title">PUBLIC ZONE</text>
  
  <!-- Arbiter Identity -->
  <rect class="subzone" x="600" y="180" width="400" height="35" />
  <text x="800" y="202" class="subzone-title">zone_arbiter_identity</text>

  <!-- Dispatch Receiving Zone -->
  <rect class="subzone" x="120" y="230" width="1360" height="110" />
  <text x="800" y="250" class="subzone-title">zone_dispatch_receiving</text>

  <!-- Lanes 1-5 -->
  <rect class="lane-zone" x="150" y="260" width="220" height="60" />
  <text x="260" y="295" class="lane-title">Lane 1 (P1 Case)</text>

  <rect class="lane-zone" x="420" y="260" width="220" height="60" />
  <text x="530" y="295" class="lane-title">Lane 2 (P2 Case)</text>

  <rect class="lane-zone" x="690" y="260" width="220" height="60" />
  <text x="800" y="295" class="lane-title">Lane 3 (P3 Case)</text>

  <rect class="lane-zone" x="960" y="260" width="220" height="60" />
  <text x="1070" y="295" class="lane-title">Lane 4 (P4 Case)</text>

  <rect class="lane-zone" x="1230" y="260" width="220" height="60" />
  <text x="1340" y="295" class="lane-title">Lane 5 (P5 Case)</text>


  <!-- ========================================== -->
  <!-- ARBITER SCREEN (The Divider at 25%)        -->
  <!-- ========================================== -->
  <line class="screen" x1="60" y1="380" x2="1540" y2="380" />
  <rect x="650" y="365" width="300" height="30" fill="#0B0F19" rx="6" ry="6" />
  <text x="800" y="387" class="screen-label">ARBITER SCREEN</text>


  <!-- ========================================== -->
  <!-- ARBITER TABLEAU (Private Mat - 75%)        -->
  <!-- ========================================== -->
  <rect class="arbiter-tableau" x="80" y="410" width="1440" height="1130" />
  <text x="800" y="440" class="mat-title">ARBITER TABLEAU (zone_arbiter_tableau)</text>
  
  <!-- Row 1: Threshold Slider (Spanning full width) -->
  <rect class="subzone" x="120" y="460" width="1360" height="60" />
  <text x="800" y="495" class="subzone-title">zone_arbiter_threshold</text>

  <!-- Row 2 (Left): Arbiter Supply (Square) -->
  <rect class="hand-zone" x="120" y="540" width="660" height="360" />
  <text x="450" y="570" class="subzone-title">zone_arbiter_supply</text>
  
  <!-- Supply Col 1 -->
  <rect class="nested-zone" x="140" y="580" width="280" height="45" />
  <text x="280" y="608" class="nested-title">zone_presence_chips</text>

  <rect class="nested-zone" x="140" y="640" width="280" height="45" />
  <text x="280" y="668" class="nested-title">zone_dominant_markers</text>

  <rect class="nested-zone" x="140" y="700" width="280" height="45" />
  <text x="280" y="728" class="nested-title">zone_structure_blocks</text>

  <rect class="nested-zone" x="140" y="760" width="280" height="45" />
  <text x="280" y="788" class="nested-title">zone_modifier_tokens</text>

  <rect class="nested-zone" x="140" y="820" width="280" height="45" />
  <text x="280" y="848" class="nested-title">zone_visibility_markers</text>

  <!-- Supply Col 2 -->
  <rect class="nested-zone" x="460" y="580" width="300" height="45" />
  <text x="610" y="608" class="nested-title">zone_established_markers</text>

  <rect class="nested-zone" x="460" y="640" width="300" height="45" />
  <text x="610" y="668" class="nested-title">zone_tension_markers</text>

  <rect class="nested-zone" x="460" y="700" width="300" height="45" />
  <text x="610" y="728" class="nested-title">zone_status_markers</text>

  <rect class="nested-zone" x="460" y="760" width="300" height="45" />
  <text x="610" y="788" class="nested-title">zone_boost_markers</text>

  <rect class="nested-zone" x="460" y="820" width="300" height="45" />
  <text x="610" y="848" class="nested-title">zone_intel_tokens</text>


  <!-- Row 2 (Right Top): Accord & Apex -->
  <rect class="subzone" x="800" y="540" width="320" height="170" />
  <text x="960" y="625" class="subzone-title">zone_accord_supply</text>

  <rect class="subzone" x="1140" y="540" width="340" height="170" />
  <text x="1310" y="625" class="subzone-title">zone_sealed_apex_supply</text>

  <!-- Row 2 (Right Bottom): Card Supply -->
  <rect class="hand-zone" x="800" y="730" width="680" height="170" />
  <text x="1140" y="755" class="subzone-title">zone_arbiter_card_supply</text>

  <rect class="nested-zone" x="820" y="770" width="140" height="110" />
  <text x="890" y="825" class="nested-title">zone_ns_slips</text>

  <rect class="nested-zone" x="980" y="770" width="140" height="110" />
  <text x="1050" y="825" class="nested-title">zone_is_slips</text>

  <rect class="nested-zone" x="1140" y="770" width="140" height="110" />
  <text x="1210" y="825" class="nested-title">zone_debrief_cards</text>

  <rect class="nested-zone" x="1300" y="770" width="160" height="110" />
  <text x="1380" y="825" class="nested-title">zone_broadcast_decks</text>


  <!-- Bottom Row: Covert Resolution Grid -->
  <rect class="subzone" x="120" y="920" width="1360" height="580" />
  <text x="800" y="945" class="subzone-title">zone_covert_resolution_grid</text>
  <text x="800" y="965" class="subtitle">Unpacking &amp; Resolution of Dispatch Packets</text>

  <!-- Lane 1 -->
  <rect class="lane-zone" x="150" y="980" width="220" height="500" />
  <text x="260" y="1010" class="lane-title">Lane 1 Resolution</text>
  <rect class="nested-zone" x="160" y="1030" width="200" height="70" />
  <text x="260" y="1065" class="nested-title">Beat 1 Cards</text>
  <rect class="nested-zone" x="160" y="1120" width="200" height="70" />
  <text x="260" y="1155" class="nested-title">Beat 2 Cards</text>
  <rect class="nested-zone" x="160" y="1210" width="200" height="70" />
  <text x="260" y="1245" class="nested-title">Beat 2 Targets</text>
  <rect class="nested-zone" x="160" y="1300" width="200" height="70" />
  <text x="260" y="1335" class="nested-title">Beat 3 Cards</text>
  <rect class="nested-zone" x="160" y="1390" width="200" height="70" />
  <text x="260" y="1425" class="nested-title">Beat 3 Targets</text>

  <!-- Lane 2 -->
  <rect class="lane-zone" x="420" y="980" width="220" height="500" />
  <text x="530" y="1010" class="lane-title">Lane 2 Resolution</text>
  <rect class="nested-zone" x="430" y="1030" width="200" height="70" />
  <text x="530" y="1065" class="nested-title">Beat 1 Cards</text>
  <rect class="nested-zone" x="430" y="1120" width="200" height="70" />
  <text x="530" y="1155" class="nested-title">Beat 2 Cards</text>
  <rect class="nested-zone" x="430" y="1210" width="200" height="70" />
  <text x="530" y="1245" class="nested-title">Beat 2 Targets</text>
  <rect class="nested-zone" x="430" y="1300" width="200" height="70" />
  <text x="530" y="1335" class="nested-title">Beat 3 Cards</text>
  <rect class="nested-zone" x="430" y="1390" width="200" height="70" />
  <text x="530" y="1425" class="nested-title">Beat 3 Targets</text>

  <!-- Lane 3 -->
  <rect class="lane-zone" x="690" y="980" width="220" height="500" />
  <text x="800" y="1010" class="lane-title">Lane 3 Resolution</text>
  <rect class="nested-zone" x="700" y="1030" width="200" height="70" />
  <text x="800" y="1065" class="nested-title">Beat 1 Cards</text>
  <rect class="nested-zone" x="700" y="1120" width="200" height="70" />
  <text x="800" y="1155" class="nested-title">Beat 2 Cards</text>
  <rect class="nested-zone" x="700" y="1210" width="200" height="70" />
  <text x="800" y="1245" class="nested-title">Beat 2 Targets</text>
  <rect class="nested-zone" x="700" y="1300" width="200" height="70" />
  <text x="800" y="1335" class="nested-title">Beat 3 Cards</text>
  <rect class="nested-zone" x="700" y="1390" width="200" height="70" />
  <text x="800" y="1425" class="nested-title">Beat 3 Targets</text>

  <!-- Lane 4 -->
  <rect class="lane-zone" x="960" y="980" width="220" height="500" />
  <text x="1070" y="1010" class="lane-title">Lane 4 Resolution</text>
  <rect class="nested-zone" x="970" y="1030" width="200" height="70" />
  <text x="1070" y="1065" class="nested-title">Beat 1 Cards</text>
  <rect class="nested-zone" x="970" y="1120" width="200" height="70" />
  <text x="1070" y="1155" class="nested-title">Beat 2 Cards</text>
  <rect class="nested-zone" x="970" y="1210" width="200" height="70" />
  <text x="1070" y="1245" class="nested-title">Beat 2 Targets</text>
  <rect class="nested-zone" x="970" y="1300" width="200" height="70" />
  <text x="1070" y="1335" class="nested-title">Beat 3 Cards</text>
  <rect class="nested-zone" x="970" y="1390" width="200" height="70" />
  <text x="1070" y="1425" class="nested-title">Beat 3 Targets</text>

  <!-- Lane 5 -->
  <rect class="lane-zone" x="1230" y="980" width="220" height="500" />
  <text x="1340" y="1010" class="lane-title">Lane 5 Resolution</text>
  <rect class="nested-zone" x="1240" y="1030" width="200" height="70" />
  <text x="1340" y="1065" class="nested-title">Beat 1 Cards</text>
  <rect class="nested-zone" x="1240" y="1120" width="200" height="70" />
  <text x="1340" y="1155" class="nested-title">Beat 2 Cards</text>
  <rect class="nested-zone" x="1240" y="1210" width="200" height="70" />
  <text x="1340" y="1245" class="nested-title">Beat 2 Targets</text>
  <rect class="nested-zone" x="1240" y="1300" width="200" height="70" />
  <text x="1340" y="1335" class="nested-title">Beat 3 Cards</text>
  <rect class="nested-zone" x="1240" y="1390" width="200" height="70" />
  <text x="1340" y="1425" class="nested-title">Beat 3 Targets</text>

</svg>
