<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .area-boundary { fill: #111827; stroke: #4B5563; stroke-width: 4; rx: 16; ry: 16; }
      
      .faction-terminal { fill: #1F2937; stroke: #374151; stroke-width: 3; rx: 12; ry: 12; }
      .faction-resolution-grid { fill: #1e253c; stroke: #374151; stroke-width: 3; rx: 12; ry: 12; }
      
      .subzone { fill: #080b13; stroke: #3B82F6; stroke-width: 2; stroke-dasharray: 4 4; rx: 8; ry: 8; }
      .hand-zone { fill: #172033; stroke: #60A5FA; stroke-width: 2; stroke-dasharray: 6 6; rx: 12; ry: 12; }
      .nested-zone { fill: #080b13; stroke: #93C5FD; stroke-width: 1; stroke-dasharray: 2 2; rx: 6; ry: 6; }
      
      .screen { fill: none; stroke: #F87171; stroke-width: 8; stroke-linecap: round; }
      
      .title { fill: #F3F4F6; font-family: "Inter", "Segoe UI", sans-serif; font-size: 28px; font-weight: 600; text-anchor: middle; }
      .mat-title { fill: #9CA3AF; font-family: "Inter", "Segoe UI", sans-serif; font-size: 22px; font-weight: 600; text-anchor: middle; letter-spacing: 2px; }
      .subzone-title { fill: #60A5FA; font-family: "Inter", "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; text-anchor: middle; }
      .nested-title { fill: #93C5FD; font-family: "Inter", "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; text-anchor: middle; }
      .subtitle { fill: #6B7280; font-family: "Inter", "Segoe UI", sans-serif; font-size: 12px; text-anchor: middle; font-style: italic; }
      .screen-label { fill: #F87171; font-family: "Inter", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; letter-spacing: 4px; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1300" />

  <rect class="area-boundary" x="50" y="50" width="1500" height="1200" />
  <text x="800" y="100" class="title">FACTION PLAYER AREA (zone_p1_area - zone_p5_area)</text>

  <!-- ========================================== -->
  <!-- FACTION RESOLUTION GRID (Public Mat)       -->
  <!-- ========================================== -->
  <rect class="faction-resolution-grid" x="80" y="140" width="1440" height="480" />
  <text x="800" y="180" class="mat-title">FACTION RESOLUTION GRID</text>
  
  <!-- Faction Identity Card (Narrow band front/top) -->
  <rect class="subzone" x="500" y="210" width="600" height="50" />
  <text x="800" y="240" class="subzone-title">zone_faction_identity</text>

  <!-- Faction Modifier Deck (Replaced threshold) -->
  <rect class="subzone" x="120" y="210" width="220" height="380" />
  <text x="230" y="400" class="subzone-title">zone_faction_modifier_deck</text>

  <!-- Active Operations Parent -->
  <rect class="hand-zone" x="380" y="280" width="1100" height="310" />
  <text x="930" y="310" class="subzone-title">zone_active_operations</text>

  <!-- Row 1 -->
  <rect class="nested-zone" x="400" y="330" width="1060" height="70" />
  <text x="930" y="360" class="nested-title">Row 1: CM Card Played &amp; Active Operations (Ops + Action Modifiers)</text>

  <!-- Row 2 -->
  <rect class="nested-zone" x="400" y="415" width="1060" height="70" />
  <text x="930" y="445" class="nested-title">Row 2: Current React Card &amp; Target Profiles (Matched to Row 1)</text>

  <!-- Row 3 -->
  <rect class="nested-zone" x="400" y="500" width="1060" height="70" />
  <text x="930" y="530" class="nested-title">Row 3: Standing Effects</text>


  <!-- ========================================== -->
  <!-- FACTION SCREEN (The Divider)               -->
  <!-- ========================================== -->
  <line class="screen" x1="60" y1="650" x2="1540" y2="650" />
  <rect x="650" y="635" width="300" height="30" fill="#0B0F19" rx="6" ry="6" />
  <text x="800" y="657" class="screen-label">FACTION SCREEN</text>


  <!-- ========================================== -->
  <!-- FACTION TERMINAL (Private Mat)             -->
  <!-- ========================================== -->
  <rect class="faction-terminal" x="80" y="690" width="1440" height="530" />
  <text x="800" y="730" class="mat-title">FACTION TERMINAL</text>
  
  <!-- Left Side: Pools, Slips, Decks -->
  <rect class="subzone" x="120" y="760" width="220" height="130" />
  <text x="230" y="825" class="subzone-title">zone_resource_pool</text>

  <rect class="subzone" x="120" y="910" width="220" height="130" />
  <text x="230" y="975" class="subzone-title">zone_intel_and_slips</text>

  <rect class="subzone" x="120" y="1060" width="220" height="130" />
  <text x="230" y="1125" class="subzone-title">zone_deployment_markers</text>

  <!-- Center-Left Side -->
  <rect class="subzone" x="370" y="760" width="220" height="130" />
  <text x="480" y="825" class="subzone-title">zone_draw_deck</text>

  <rect class="subzone" x="370" y="910" width="220" height="130" />
  <text x="480" y="975" class="subzone-title">zone_discard_deck</text>
  
  <rect class="subzone" x="370" y="1060" width="220" height="130" />
  <text x="480" y="1125" class="subzone-title">zone_target_profiles</text>
  <text x="480" y="1145" class="subtitle">Blank Storage</text>

  <!-- The HAND (Parent for cards) -->
  <rect class="hand-zone" x="620" y="760" width="620" height="430" />
  <text x="930" y="800" class="subzone-title">zone_hand</text>


  <!-- Dispatch Case -->
  <rect class="subzone" x="1270" y="760" width="220" height="430" />
  <text x="1380" y="975" class="subzone-title">zone_dispatch_case</text>
  <text x="1380" y="995" class="subtitle">Packet Loading Area</text>
  
  <!-- Nested Hand Zones -->
  <!-- Row 1 -->
  <rect class="nested-zone" x="650" y="830" width="265" height="70" />
  <text x="782" y="870" class="nested-title">zone_classified_objective</text>

  <rect class="nested-zone" x="945" y="830" width="265" height="70" />
  <text x="1077" y="870" class="nested-title">zone_emergency_response</text>
  
  <!-- Row 2 -->
  <rect class="nested-zone" x="650" y="920" width="265" height="70" />
  <text x="782" y="960" class="nested-title">zone_operative</text>
  
  <rect class="nested-zone" x="945" y="920" width="265" height="70" />
  <text x="1077" y="960" class="nested-title">zone_apex</text>

  <!-- Row 3 -->
  <rect class="nested-zone" x="650" y="1010" width="265" height="70" />
  <text x="782" y="1050" class="nested-title">zone_cm_cards</text>

  <rect class="nested-zone" x="945" y="1010" width="265" height="70" />
  <text x="1077" y="1050" class="nested-title">zone_floor_act</text>
  
  <!-- Row 4 -->
  <rect class="nested-zone" x="650" y="1100" width="560" height="70" />
  <text x="930" y="1140" class="nested-title">zone_held_cards (CA/PA/Mod cards)</text>
  
</svg>
